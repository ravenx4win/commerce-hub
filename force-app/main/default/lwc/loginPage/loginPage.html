<template>
    <div class="login-page-container">
        <!-- Breadcrumb Bar -->
        <nav class="login-breadcrumb-bar" aria-label="Breadcrumb">
            <div class="breadcrumb-inner">
                <button class="breadcrumb-link" onclick={handleHomeClick}>Home</button>
                <span class="breadcrumb-separator">/</span>
                <span class="breadcrumb-current">Customer Sign In</span>
            </div>
        </nav>

        <!-- Main Content Area -->
        <div class="login-main-wrapper">
            <div class="login-card">
                <!-- Brand / Header Section -->
                <div class="login-header">
                    <div class="brand-badge">
                        <span class="brand-icon" aria-hidden="true"></span>
                        <span class="brand-title">Commerce Hub</span>
                    </div>
                    <h1 class="login-heading">Welcome Back</h1>
                    <p class="login-subheading">Sign in to your customer account to view saved addresses and complete checkout.</p>
                </div>

                <!-- Error / Status Alert -->
                <template if:true={errorMessage}>
                    <div class="login-alert alert-error" role="alert">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="alert-icon">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span>{errorMessage}</span>
                    </div>
                </template>

                <template if:true={successMessage}>
                    <div class="login-alert alert-success" role="status">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="alert-icon">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span>{successMessage}</span>
                    </div>
                </template>

                <!-- 1-Click Fast Customer Login for Frictionless Checkout -->
                <div class="demo-login-box">
                    <div class="demo-box-header">
                        <span class="demo-badge">Quick Access</span>
                        <span class="demo-tip">Instant order placement test</span>
                    </div>
                    <p class="demo-desc">Sign in with one click as registered customer to place orders and manage addresses:</p>
                    <button class="btn-demo-login" onclick={handleDemoLogin} disabled={isLoading}>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>Sign In as Customer (XYZ Kanwar)</span>
                    </button>
                </div>

                <div class="or-divider">
                    <span class="divider-text">OR SIGN IN WITH CREDENTIALS</span>
                </div>

                <!-- Standard Credentials Form -->
                <form class="login-form" onsubmit={handleSubmit}>
                    <!-- Email / Username Input -->
                    <div class="form-group">
                        <label class="form-label" for="login-email">Email or Username *</label>
                        <div class="input-with-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="field-icon">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input
                                id="login-email"
                                data-field="email"
                                type="text"
                                class="form-input"
                                placeholder="name@example.com"
                                value={email}
                                oninput={handleEmailChange}
                                autocomplete="username"
                                required
                            />
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="form-group">
                        <div class="password-label-row">
                            <label class="form-label" for="login-password">Password *</label>
                            <button type="button" class="btn-link-sm" onclick={handleForgotPassword}>
                                Forgot Password?
                            </button>
                        </div>
                        <div class="input-with-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="field-icon">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input
                                id="login-password"
                                data-field="password"
                                type={passwordInputType}
                                class="form-input"
                                placeholder="Enter your password"
                                value={password}
                                oninput={handlePasswordChange}
                                autocomplete="current-password"
                                required
                            />
                            <button
                                type="button"
                                class="password-toggle-btn"
                                onclick={togglePasswordVisibility}
                                aria-label={passwordToggleLabel}
                            >
                                <template if:true={showPassword}>
                                    <!-- Eye Off Icon -->
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="toggle-icon">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </template>
                                <template if:false={showPassword}>
                                    <!-- Eye Icon -->
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="toggle-icon">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </template>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="form-options-row">
                        <label class="checkbox-container">
                            <input
                                type="checkbox"
                                checked={rememberMe}
                                onchange={handleRememberMeChange}
                            />
                            <span class="checkmark"></span>
                            <span class="checkbox-text">Remember this device</span>
                        </label>
                    </div>

                    <!-- Sign In Submit Button -->
                    <button
                        type="submit"
                        class="btn-primary btn-submit"
                        disabled={isLoading}
                        aria-busy={isLoading}
                    >
                        <template if:true={isLoading}>
                            <div class="spinner"></div>
                            <span>Signing In...</span>
                        </template>
                        <template if:false={isLoading}>
                            <span>Sign In</span>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="submit-arrow">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </template>
                    </button>
                </form>

                <!-- Navigation & Alternative Actions -->
                <div class="login-footer">
                    <p class="signup-prompt">
                        New to Commerce Hub?
                        <button class="btn-link-accent" onclick={handleDemoLogin}>
                            Create a Free Customer Account
                        </button>
                    </p>
                    <div class="return-nav-wrap">
                        <button class="btn-text-nav" onclick={handleHomeClick}>
                            &larr; Return to Storefront
                        </button>
                    </div>
                </div>
            </div>

            <!-- Side Benefits Banner -->
            <div class="login-perks-card">
                <h2 class="perks-title">Why Sign In to Commerce Hub?</h2>
                <ul class="perks-list">
                    <li class="perk-item">
                        <div class="perk-icon-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                        </div>
                        <div class="perk-text">
                            <strong>Saved Delivery Addresses</strong>
                            <span>Checkout faster with saved home and office addresses.</span>
                        </div>
                    </li>
                    <li class="perk-item">
                        <div class="perk-icon-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                        </div>
                        <div class="perk-text">
                            <strong>Order Tracking & History</strong>
                            <span>Track shipments in real-time and review previous orders.</span>
                        </div>
                    </li>
                    <li class="perk-item">
                        <div class="perk-icon-wrap">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                        </div>
                        <div class="perk-text">
                            <strong>100% Safe & Secure</strong>
                            <span>Protected checkout powered by Salesforce Enterprise Cloud.</span>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</template>
